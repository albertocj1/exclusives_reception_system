        <!-- Orders Grid (Responsive Columns) -->

  </div><!-- /#app -->

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-24 opacity-0 transition-all duration-300 bg-brand-slate border border-brand-gold/40 text-brand-ice text-xs md:text-sm font-mono px-5 md:px-6 py-2.5 md:py-3 rounded-full shadow-2xl z-50 pointer-events-none flex items-center gap-2 md:gap-3 whitespace-nowrap">
    <span id="toast-msg">Action completed</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const peso = (n) => '\u20B1' + Number(n || 0).toLocaleString('en-PH');
    const API_BASE = (window.API_BASE || '').replace(/\/+$/, '');
    const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    let activeTab = 'sent';
    let ordersData = [];
    let pollingInterval = null;

    // ---------------- AUTH ----------------
    function showApp() { 
      $('gate').classList.add('hidden'); 
      $('app').classList.remove('hidden'); 
      startPolling();
    }
    
    function showGate() { 
      $('app').classList.add('hidden'); 
      $('gate').classList.remove('hidden'); 
      stopPolling();
    }

    async function doLogin() {
      const err = $('gate-error');
      err.classList.add('hidden');
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) return;
      $('login-btn').disabled = true; $('login-btn').textContent = 'Logging in\u2026';
      
      try {
        const res = await sb.auth.signInWithPassword({ email, password });
        if (res.error) throw res.error;
        showApp();
      } catch (e) {
        err.textContent = e.message || 'Login failed.';
        err.classList.remove('hidden');
      } finally {
        $('login-btn').disabled = false; $('login-btn').textContent = 'Log in';
      }
    }
    
    $('login-btn').addEventListener('click', doLogin);
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

    $('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      showGate();
    });

    sb.auth.getSession().then((s) => {
      if (s?.data?.session) showApp();
      else showGate();
    });

    // ---------------- CLOCK ----------------
    function tickClock() {
      $('clock').textContent = new Date().toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ---------------- API HELPERS ----------------
    async function apiFetch(endpoint, method = 'GET', body = null) {
      const s = await sb.auth.getSession();
      const headers = { 'Content-Type': 'application/json' };
      
      if (s?.data?.session?.access_token) {
        headers['Authorization'] = 'Bearer ' + s.data.session.access_token;
      }

      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);

      const res = await fetch(API_BASE + endpoint, options);
      if (res.status === 401) {
        showGate();
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'API request failed');
      }
      return await res.json();
    }

    // ---------------- CORE LOGIC ----------------
    function startPolling() {
      fetchOrders();
      pollingInterval = setInterval(fetchOrders, 10000);
    }

    function stopPolling() {
      if (pollingInterval) clearInterval(pollingInterval);
    }

    async function fetchOrders() {
      try {
        const rawOrders = await apiFetch('/api/orders');
        ordersData = rawOrders || [];
        updateTabCounts();
        renderView();
      } catch (err) {
        console.error("Failed to fetch orders:", err);
      }
    }

    async function changeOrderStatus(orderId, newStatus) {
      try {
        await apiFetch(`/api/orders/${orderId}/status`, 'PATCH', { status: newStatus });
        showToast(`Order marked as ${newStatus}`);
        fetchOrders();
      } catch (err) {
        alert("Could not update order: " + err.message);
      }
    }

    function updateTabCounts() {
      const sentCount = ordersData.filter(o => o.status === 'sent').length;
      const heldCount = ordersData.filter(o => o.status === 'held').length;
      $('count-sent').textContent = `(${sentCount})`;
      $('count-held').textContent = `(${heldCount})`;
    }

    function timeSince(dateString) {
      const date = new Date(dateString);
      const seconds = Math.floor((new Date() - date) / 1000);
      let interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "h";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "m";
      return "Now";
    }

    // ---------------- UI RENDERING ----------------
    function renderView() {
      if (activeTab === 'dashboard') {
        $('orders-grid').classList.add('hidden');
        $('empty-state').classList.add('hidden');
        $('dashboard-view').classList.remove('hidden');
        $('dashboard-view').classList.add('flex');
        renderDashboard();
      } else {
        $('dashboard-view').classList.add('hidden');
        $('dashboard-view').classList.remove('flex');
        $('orders-grid').classList.remove('hidden');
        renderGrid();
      }
    }

    function renderDashboard() {
      const fulfilled = ordersData.filter(o => o.status === 'fulfilled');
      
      const totalRevenue = fulfilled.reduce((sum, order) => sum + (order.total_amount || 0), 0);
      const ordersCount = fulfilled.length;
      const aov = ordersCount > 0 ? (totalRevenue / ordersCount) : 0;

      $('dash-revenue').textContent = peso(totalRevenue);
      $('dash-orders').textContent = ordersCount;
      $('dash-aov').textContent = peso(aov);

      const itemStats = {};
      fulfilled.forEach(order => {
        (order.items || []).forEach(item => {
          if (!itemStats[item.name]) {
            itemStats[item.name] = { qty: 0, revenue: 0 };
          }
          itemStats[item.name].qty += item.qty;
          itemStats[item.name].revenue += (item.qty * (item.price || 0));
        });
      });

      const sortedItems = Object.entries(itemStats)
        .map(([name, stats]) => ({ name, qty: stats.qty, revenue: stats.revenue }))
        .sort((a, b) => b.qty - a.qty);

      if (sortedItems.length === 0) {
        $('dash-top-items').innerHTML = `<div class="text-brand-muted text-xs md:text-sm italic text-center md:text-left">No items fulfilled yet.</div>`;
        return;
      }

      $('dash-top-items').innerHTML = sortedItems.map((item, index) => `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 md:p-4 rounded-xl bg-white/5 border border-white/5 hover:border-brand-gold/30 transition-colors gap-3 sm:gap-0">
          <div class="flex items-center gap-3 md:gap-4">
            <div class="font-mono text-brand-gold/50 text-xs md:text-sm w-4">${index + 1}.</div>
            <div class="text-brand-ice text-xs md:text-sm">${item.name}</div>
          </div>
          <div class="flex items-center gap-4 md:gap-6 sm:justify-end">
            <div class="text-left sm:text-right">
              <div class="font-mono text-[9px] md:text-[10px] text-brand-muted tracking-widest uppercase">Qty</div>
              <div class="font-mono text-brand-ice text-xs md:text-sm">${item.qty}</div>
            </div>
            <div class="w-20 md:w-24 text-right">
              <div class="font-mono text-[9px] md:text-[10px] text-brand-muted tracking-widest uppercase">Sales</div>
              <div class="font-mono text-brand-gold text-xs md:text-sm">${peso(item.revenue)}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderGrid() {
      const filteredOrders = ordersData.filter(o => o.status === activeTab);
      const grid = $('orders-grid');
      const empty = $('empty-state');

      if (filteredOrders.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      grid.innerHTML = filteredOrders.map(order => {
        const timeStr = timeSince(order.created_at);
        const isNew = (new Date() - new Date(order.created_at)) < 60000;
        const pulseClass = (isNew && activeTab === 'sent') ? 'new-order-pulse' : '';
        const tableName = order.table_name || 'Walk-in / Bar';

        const itemsHtml = (order.items || []).map(item => `
          <div class="flex items-start gap-2.5 md:gap-3 py-2 md:py-1.5 border-b border-white/5 last:border-0">
            <div class="font-mono text-brand-gold font-bold text-xs md:text-sm min-w-[24px] md:min-w-[28px]">${item.qty}x</div>
            <div class="flex-1">
              <div class="text-brand-ice text-xs md:text-sm leading-tight">${item.name}</div>
            </div>
            <div class="font-mono text-brand-muted text-[11px] md:text-xs">${peso(item.price * item.qty)}</div>
          </div>
        `).join('');

        let actionButtons = '';
        if (activeTab === 'sent') {
          actionButtons = `
            <button onclick="window.updateOrder('${order.id}', 'fulfilled')" class="flex-1 bg-green-500/20 text-green-300 hover:bg-green-500/30 border border-green-500/30 py-2.5 md:py-3 rounded-lg md:rounded-xl font-mono text-[10px] md:text-[11px] tracking-widest uppercase transition-colors">Fulfill</button>
            <button onclick="window.updateOrder('${order.id}', 'held')" class="flex-1 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 border border-amber-500/30 py-2.5 md:py-3 rounded-lg md:rounded-xl font-mono text-[10px] md:text-[11px] tracking-widest uppercase transition-colors">Hold</button>
          `;
        } else if (activeTab === 'held') {
          actionButtons = `
            <button onclick="window.updateOrder('${order.id}', 'sent')" class="flex-1 bg-brand-gold/20 text-brand-gold hover:bg-brand-gold/30 border border-brand-gold/30 py-2.5 md:py-3 rounded-lg md:rounded-xl font-mono text-[10px] md:text-[11px] tracking-widest uppercase transition-colors">Send to Bar</button>
            <button onclick="window.updateOrder('${order.id}', 'cancelled')" class="flex-1 bg-red-500/10 text-red-300 hover:bg-red-500/20 border border-red-500/30 py-2.5 md:py-3 rounded-lg md:rounded-xl font-mono text-[10px] md:text-[11px] tracking-widest uppercase transition-colors">Cancel</button>
          `;
        } else if (activeTab === 'fulfilled' || activeTab === 'cancelled') {
          actionButtons = `
            <button onclick="window.updateOrder('${order.id}', 'sent')" class="w-full bg-white/5 text-brand-muted hover:bg-white/10 hover:text-brand-ice border border-white/10 py-2.5 md:py-3 rounded-lg md:rounded-xl font-mono text-[10px] md:text-[11px] tracking-widest uppercase transition-colors">Re-open (Sent)</button>
          `;
        }

        const notesHtml = order.notes ? `
          <div class="mt-3 md:mt-4 p-2.5 md:p-3 bg-red-900/20 border border-red-500/30 rounded-lg md:rounded-xl">
            <div class="font-mono text-[9px] md:text-[10px] tracking-widest text-red-400 uppercase mb-1">Notes</div>
            <div class="text-xs md:text-sm text-red-100 font-light italic">${order.notes}</div>
          </div>
        ` : '';

        return `
          <div class="bg-brand-slate border border-white/10 rounded-xl md:rounded-2xl p-4 md:p-5 flex flex-col h-full shadow-lg ${pulseClass}">
            <div class="flex items-center justify-between mb-3 md:mb-4 pb-3 md:pb-4 border-b border-white/5">
              <div class="font-serif text-lg md:text-xl text-brand-ice truncate pr-2">${tableName}</div>
              <div class="font-mono text-[10px] md:text-xs text-brand-muted whitespace-nowrap bg-brand-obsidian px-2 py-1 md:px-2.5 md:py-1 rounded-md">${timeStr}</div>
            </div>
            
            <div class="flex-1 overflow-y-auto pr-1 mb-3 md:mb-4">
              ${itemsHtml}
              ${notesHtml}
            </div>
            
            <div class="ticket-tear pt-4 md:pt-5 mt-auto flex flex-col gap-2.5 md:gap-3">
              <div class="flex justify-between items-center text-xs md:text-sm">
                <span class="font-serif text-brand-muted">Total</span>
                <span class="font-mono text-brand-gold">${peso(order.total_amount)}</span>
              </div>
              <div class="flex gap-2">
                ${actionButtons}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.updateOrder = function(id, status) {
      changeOrderStatus(id, status);
    };

    // ---------------- TAB NAVIGATION ----------------
    document.querySelectorAll('.status-tab').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.status-tab').forEach(b => {
          b.classList.remove('active', 'border-brand-gold', 'bg-brand-goldDim/20', 'text-brand-gold');
          b.classList.add('border-white/10', 'text-brand-muted');
        });
        
        const target = e.currentTarget;
        target.classList.remove('border-white/10', 'text-brand-muted');
        target.classList.add('active', 'border-brand-gold', 'bg-brand-goldDim/20', 'text-brand-gold');
        
        activeTab = target.getAttribute('data-tab');
        renderView(); 
      });
    });

    // ---------------- TOAST ----------------
    function showToast(msg) {
      const t = $('toast');
      $('toast-msg').textContent = msg;
      t.classList.remove('translate-y-24', 'opacity-0');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 3000);
    }

  })();
  </script>
</body>
</html>
