  <style>
    .ticket-tear {

<body class="bg-brand-obsidian text-brand-ice font-sans antialiased min-h-screen">

  <!-- ================= LOGIN GATE ================= -->
  <div id="gate" class="min-h-screen flex items-center justify-center px-4 sm:px-6">
    <div class="w-full max-w-md bg-brand-slate border border-white/5 rounded-3xl p-6 sm:p-10 shadow-2xl">

      </div>
      <label class="block font-mono text-[10px] sm:text-[11px] tracking-widest text-brand-muted uppercase mb-2">Email</label>

             class="w-full bg-brand-obsidian border border-white/10 rounded-xl focus:border-brand-gold text-brand-ice text-sm sm:text-base px-4 py-3 sm:py-4 outline-none mb-6">
      <button id="login-btn" class="w-full py-3.5 sm:py-4 rounded-full bg-brand-gold text-brand-obsidian font-mono text-xs sm:text-sm font-bold tracking-widest uppercase hover:bg-brand-ice transition-colors shadow-[0_0_15px_rgba(245,197,24,0.3)]">Log in</button>
      <p id="gate-error" class="text-red-400 text-xs sm:text-sm font-mono mt-4 hidden text-center"></p>
    </div>
  </div>

  <!-- ================= GCASH MODAL ================= -->
  <div id="gcash-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-brand-slate border border-brand-gold/30 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl">
        <h3 class="font-serif text-2xl text-brand-ice mb-1">Pay via GCash</h3>
        <p class="font-mono text-[10px] sm:text-xs text-brand-muted mb-6 uppercase tracking-widest">Guest scans this QR</p>
        
        <div class="bg-white p-3 rounded-2xl inline-block mb-6 shadow-lg">
            <img src="images/gcash-qr.png" alt="GCash QR" class="w-40 h-40 sm:w-48 sm:h-48 object-contain">

        <div class="flex flex-col gap-3">

            <input type="file" id="camera-input" accept="image/jpeg, image/png, image/webp" capture="environment" class="hidden">
            
            <button id="btn-camera" class="w-full bg-blue-500 text-white py-3.5 sm:py-4 rounded-xl font-mono text-[11px] sm:text-xs tracking-widest uppercase font-bold transition-colors hover:bg-blue-400">
                📸 Open Camera for Receipt
            </button>
            <div id="upload-status" class="font-mono text-[10px] tracking-widest uppercase text-brand-gold hidden py-3 animate-pulse">Uploading Order & Receipt...</div>
            
            <button id="btn-close-modal" class="w-full border border-white/10 text-brand-muted hover:text-brand-ice hover:bg-white/5 py-3.5 sm:py-4 rounded-xl font-mono text-[11px] sm:text-xs tracking-widest uppercase transition-colors">Cancel</button>
        </div>

  <!-- ================= APP ================= -->
  <div id="app" class="hidden">

  <!-- Top bar -->
  <header class="border-b border-white/5 bg-brand-slate/40">
    <div class="max-w-[1600px] mx-auto px-4 md:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="font-serif text-lg md:text-xl text-brand-gold leading-none">Exclusives&nbsp;PH</div>
        <div class="hidden sm:block font-mono text-[10px] tracking-widest text-brand-muted uppercase border-l border-white/10 pl-3">Point of Sale</div>
      </div>

      <div class="flex items-center gap-2 md:gap-3 ml-auto md:ml-0">
        <input id="table-input" type="text" placeholder="Table / Guest name"
               class="w-32 sm:w-36 md:w-48 bg-brand-obsidian border border-white/10 rounded-full focus:border-brand-gold text-brand-ice text-xs px-4 py-2 outline-none placeholder:text-brand-muted/60">
        <div class="hidden md:flex items-center gap-2 font-mono text-[11px] text-brand-muted">
          <span id="clock">--:--</span>
        </div>
        <button id="logout-btn" class="font-mono text-[9px] md:text-[11px] tracking-widest uppercase text-brand-muted hover:text-brand-ice border border-white/10 rounded-full px-3 py-1.5 md:px-4 md:py-2 transition-colors">Log out</button>
      </div>
    </div>
  </header>

  <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row lg:items-start h-[calc(100dvh-56px)] overflow-hidden">

    <!-- Category rail -->
    <aside class="order-1 lg:w-52 shrink-0 border-b lg:border-b-0 lg:border-r border-white/5 lg:h-full lg:sticky lg:top-0 overflow-x-auto lg:overflow-y-auto no-scrollbar">
      <div id="category-list" class="flex lg:flex-col gap-2 p-3 lg:p-4 min-w-max lg:min-w-0"></div>
    </aside>

    <!-- Item grid -->
    <main class="order-2 flex-1 min-w-0 px-3 sm:px-4 md:px-6 py-4 overflow-y-auto h-full">
      <div class="mb-4">
        <input id="search-input" type="text" placeholder="Search this category…"
               class="w-full bg-brand-slate border border-white/10 rounded-2xl focus:border-brand-gold text-brand-ice text-sm px-5 py-3 outline-none placeholder:text-brand-muted/60 shadow-inner">
      </div>
      <div id="item-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2 sm:gap-3"></div>
      <div id="item-empty" class="hidden text-center text-brand-muted text-sm font-light py-16">
        Nothing matches that search.
      </div>
    </main>

    <!-- Order ticket -->
    <aside class="order-3 lg:w-[380px] shrink-0 border-t lg:border-t-0 lg:border-l border-white/5 h-[40dvh] lg:h-full bg-brand-obsidian lg:bg-transparent overflow-y-auto relative shadow-[0_-10px_20px_rgba(0,0,0,0.3)] lg:shadow-none z-10">
      <div class="p-4 md:p-5 flex flex-col h-full">

        <div class="flex items-center justify-between mb-1">
          <div class="font-serif text-lg md:text-xl text-brand-ice">Order Ticket</div>
          <div id="ticket-number" class="font-mono text-[10px] md:text-xs text-brand-gold tracking-widest">T-0000</div>
        </div>
        <div class="font-mono text-[9px] md:text-[10px] tracking-widest text-brand-muted uppercase mb-4">Manila Bay &middot; Yacht Sessions</div>

        <div id="cart-empty" class="flex-1 flex items-center justify-center text-center py-6 md:py-10">
          <p class="text-brand-muted text-xs md:text-sm font-light max-w-[220px]">No items yet — tap the menu to start a ticket.</p>
        </div>

        <div id="cart-lines" class="flex-1 space-y-3 hidden overflow-y-auto pr-1"></div>

        <div id="ticket-totals" class="ticket-tear pt-4 mt-auto hidden shrink-0">
          <div class="flex items-center justify-between text-sm md:text-base pt-2 md:pt-3">
            <span class="font-serif text-brand-ice">Total</span>
            <span id="total" class="font-mono text-brand-gold text-lg md:text-xl font-bold">₱0</span>
          </div>

          <textarea id="notes-input" rows="2" placeholder="Notes for the bar (e.g. no ice)…"
                    class="w-full mt-3 bg-brand-slate border border-white/10 rounded-xl focus:border-brand-gold text-brand-ice text-xs px-3 py-2 outline-none placeholder:text-brand-muted/60 resize-none"></textarea>

          <div class="grid grid-cols-2 gap-2 mt-3">
            <button id="btn-pay-cash" class="font-mono text-[10px] sm:text-[11px] tracking-widest uppercase bg-green-500/20 text-green-300 hover:bg-green-500/30 border border-green-500/30 rounded-xl py-3 sm:py-3.5 transition-colors font-bold shadow-lg shadow-green-900/20">Pay Cash</button>
            <button id="btn-pay-gcash" class="font-mono text-[10px] sm:text-[11px] tracking-widest uppercase bg-blue-500/20 text-blue-300 hover:bg-blue-500/30 border border-blue-500/30 rounded-xl py-3 sm:py-3.5 transition-colors font-bold shadow-lg shadow-blue-900/20">GCash QR</button>
          </div>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <button id="btn-hold" class="font-mono text-[10px] sm:text-[11px] tracking-widest uppercase border border-amber-400/30 text-amber-300 hover:bg-amber-400/10 hover:border-amber-300 rounded-xl py-3 transition-colors">Hold Order</button>
            <button id="btn-clear" class="font-mono text-[10px] sm:text-[11px] tracking-widest uppercase border border-red-400/30 text-red-300 hover:bg-red-400/10 hover:border-red-300 rounded-xl py-3 transition-colors">Clear</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  </div><!-- /#app -->

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 bg-brand-slate border border-brand-gold/40 text-brand-ice text-xs md:text-sm font-mono px-5 py-2.5 md:py-3 rounded-full shadow-2xl z-50 pointer-events-none whitespace-nowrap">
    Action complete
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const peso = (n) => '\u20B1' + Number(n || 0).toLocaleString('en-PH');
    const API_BASE = (window.API_BASE || '').replace(/\/+$/, '');
    const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    // ---------------- AUTH ----------------
    async function authHeader() {
      const s = await sb.auth.getSession();
      const token = s && s.data && s.data.session ? s.data.session.access_token : null;
      return token ? { 'Authorization': 'Bearer ' + token } : {};
    }

    function showApp() { $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); }
    function showGate() { $('app').classList.add('hidden'); $('gate').classList.remove('hidden'); }

    async function doLogin() {
      const err = $('gate-error');
      err.classList.add('hidden');
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) return;
      $('login-btn').disabled = true; $('login-btn').textContent = 'Logging in\u2026';
      try {
        const res = await sb.auth.signInWithPassword({ email, password });
        if (res.error) {
          err.textContent = res.error.message || 'Login failed.';
          err.classList.remove('hidden');
        } else {
          showApp();
        }
      } catch (e) {
        err.textContent = 'Could not reach the auth server.';
        err.classList.remove('hidden');
      } finally {
        $('login-btn').disabled = false; $('login-btn').textContent = 'Log in';
      }
    }
    $('login-btn').addEventListener('click', doLogin);
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

    $('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      showGate();
    });

    sb.auth.getSession().then((s) => {
      if (s && s.data && s.data.session) showApp();
      else showGate();
    });

    // ---------------- MENU ----------------
    const MENU = [
      {
        id: 'packages', label: 'Packages',
        items: [
          { id: 'pkg-breeze',      name: 'Breeze',    desc: '6 Sprite + 1 Absolut Vodka',        price: 3550 },
          { id: 'pkg-ignition-ab', name: 'Ignition',  desc: '6 Red Bull + 1 Absolut Vodka',      price: 3850 },
          { id: 'pkg-ignition-jg', name: 'Ignition',  desc: '6 Red Bull + 1 Jägermeister',       price: 4000 },
        ],
      },
      {
        id: 'bottles', label: 'Bottles',
        items: [
          { id: 'btl-absolut', name: 'Absolut Vodka',              price: 2850 },
          { id: 'btl-jager',   name: 'Jägermeister',                price: 3000 },
          { id: 'btl-jwblack', name: 'Johnnie Walker Black Label', price: 3195 },
        ],
      },
      {
        id: 'beverages', label: 'Beverages',
        items: [
          { id: 'bev-water',   name: 'Bottled Water',                          price: 100 },
          { id: 'bev-coke',    name: 'Coca-Cola Regular',                      price: 150 },
          { id: 'bev-sprite',  name: 'Sprite',                                 price: 150 },
          { id: 'bev-redbull', name: 'Red Bull Energy Drink',                  price: 200 },
          { id: 'bev-lemondou',name: 'Lemon-Dou', desc: 'Alcohol',             price: 150 },
          { id: 'bev-cocktail',name: 'Cocktail Drinks', desc: 'Alcohol',       price: 250 },
        ],
      },
      {
        id: 'foods', label: 'Foods',
        items: [
          { id: 'food-tacos',   name: 'Tacos',             price: 500 },
          { id: 'food-nachos',  name: 'Nachos',             price: 550 },
          { id: 'food-board',   name: 'Charcuterie Board', price: 750 },
        ],
      },
    ];

    let activeCategory = MENU[0].id;
    let searchTerm = '';
    let cart = []; 

    // ---- clock ----
    function tickClock() {
      $('clock').textContent = new Date().toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
    }
    tickClock();
    setInterval(tickClock, 15000);

    // ---- ticket number ----
    $('ticket-number').textContent = 'T-' + String(Math.floor(1000 + Math.random() * 9000));

    // ---- category rail ----
    function renderCategories() {
      const el = $('category-list');
      el.innerHTML = MENU.map((cat) => {
        const active = cat.id === activeCategory;
        return `<button data-cat="${cat.id}"
          class="tap-target text-left font-mono text-[10px] md:text-[11px] tracking-widest uppercase rounded-full lg:rounded-xl px-4 py-2.5 md:py-3 border transition-colors whitespace-nowrap
          ${active
            ? 'border-brand-gold bg-brand-goldDim/20 text-brand-gold'
            : 'border-white/10 text-brand-muted hover:text-brand-ice hover:border-white/20'}">
          ${cat.label}
          <span class="ml-1 opacity-60">(${cat.items.length})</span>
        </button>`;
      }).join('');
      el.querySelectorAll('[data-cat]').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeCategory = btn.getAttribute('data-cat');
          renderCategories();
          renderItems();
        });
      });
    }

    // ---- item grid ----
    function renderItems() {
      const cat = MENU.find((c) => c.id === activeCategory);
      const term = searchTerm.trim().toLowerCase();
      const items = cat.items.filter((it) => it.name.toLowerCase().includes(term) || (it.desc || '').toLowerCase().includes(term));

      $('item-grid').classList.toggle('hidden', items.length === 0);
      $('item-empty').classList.toggle('hidden', items.length !== 0);

      $('item-grid').innerHTML = items.map((it) => `
        <button data-add="${it.id}"
          class="tap-target group text-left bg-brand-slate border border-white/5 hover:border-brand-gold/50 rounded-xl md:rounded-2xl p-3 md:p-4 transition-colors flex flex-col justify-between min-h-[90px] md:min-h-[112px] shadow-sm">
          <div>
            <div class="text-xs md:text-sm text-brand-ice leading-tight">${it.name}</div>
            ${it.desc ? `<div class="text-brand-muted text-[9px] md:text-[10px] leading-tight mt-1">${it.desc}</div>` : ''}
          </div>
          <div class="flex items-center justify-between mt-2 md:mt-3">
            <span class="font-mono text-brand-gold text-xs md:text-sm">${peso(it.price)}</span>
            <span class="font-mono text-[9px] md:text-[10px] tracking-widest uppercase text-brand-muted group-hover:text-brand-gold transition-colors">+ Add</span>
          </div>
        </button>
      `).join('');

      $('item-grid').querySelectorAll('[data-add]').forEach((btn) => {
        btn.addEventListener('click', () => addToCart(btn.getAttribute('data-add')));
      });
    }

    function findMenuItem(id) {
      for (const cat of MENU) {
        const it = cat.items.find((i) => i.id === id);
        if (it) return it;
      }
      return null;
    }

    // ---- cart ----
    function addToCart(id) {
      const menuItem = findMenuItem(id);
      if (!menuItem) return;
      const line = cart.find((l) => l.id === id);
      if (line) line.qty += 1;
      else cart.push({ id: menuItem.id, name: menuItem.name, desc: menuItem.desc || '', price: menuItem.price, qty: 1 });
      renderCart();
    }

    function changeQty(id, delta) {
      const line = cart.find((l) => l.id === id);
      if (!line) return;
      line.qty += delta;
      if (line.qty <= 0) cart = cart.filter((l) => l.id !== id);
      renderCart();
    }

    function removeLine(id) {
      cart = cart.filter((l) => l.id !== id);
      renderCart();
    }

    function renderCart() {
      const hasItems = cart.length > 0;
      $('cart-empty').classList.toggle('hidden', hasItems);
      $('cart-lines').classList.toggle('hidden', !hasItems);
      $('ticket-totals').classList.toggle('hidden', !hasItems);

      $('cart-lines').innerHTML = cart.map((l) => `
        <div class="flex items-center gap-2 md:gap-3">
          <div class="flex-1 min-w-0">
            <div class="text-xs md:text-sm text-brand-ice truncate leading-tight">${l.name}</div>
            <div class="font-mono text-[10px] md:text-xs text-brand-muted">${peso(l.price)} ea</div>
          </div>
          <div class="flex items-center gap-1.5 md:gap-2">
            <button data-dec="${l.id}" class="tap-target w-6 h-6 md:w-7 md:h-7 rounded-full border border-white/10 text-brand-ice hover:border-brand-gold hover:text-brand-gold flex items-center justify-center text-xs md:text-sm leading-none">–</button>
            <span class="font-mono text-xs md:text-sm w-4 md:w-5 text-center">${l.qty}</span>
            <button data-inc="${l.id}" class="tap-target w-6 h-6 md:w-7 md:h-7 rounded-full border border-white/10 text-brand-ice hover:border-brand-gold hover:text-brand-gold flex items-center justify-center text-xs md:text-sm leading-none">+</button>
          </div>
          <div class="font-mono text-xs md:text-sm text-brand-gold w-14 md:w-16 text-right">${peso(l.price * l.qty)}</div>
          <button data-remove="${l.id}" class="tap-target text-brand-muted hover:text-red-300 text-sm leading-none px-1">&times;</button>
        </div>
      `).join('');

      $('cart-lines').querySelectorAll('[data-inc]').forEach((b) => b.addEventListener('click', () => changeQty(b.getAttribute('data-inc'), 1)));
      $('cart-lines').querySelectorAll('[data-dec]').forEach((b) => b.addEventListener('click', () => changeQty(b.getAttribute('data-dec'), -1)));
      $('cart-lines').querySelectorAll('[data-remove]').forEach((b) => b.addEventListener('click', () => removeLine(b.getAttribute('data-remove'))));

      const total = cart.reduce((s, l) => s + l.price * l.qty, 0);
      $('total').textContent = peso(total);
    }

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    $('search-input').addEventListener('input', (e) => { searchTerm = e.target.value; renderItems(); });

    $('btn-clear').addEventListener('click', () => {
      if (!cart.length) return;
      if (!confirm('Clear this ticket?')) return;
      newTicket();
    });

    function newTicket() {
      cart = [];
      $('notes-input').value = '';
      $('ticket-number').textContent = 'T-' + String(Math.floor(1000 + Math.random() * 9000));
      renderCart();
    }

    // ---- Standard Order Creation (Cash or Hold) ----
    async function submitOrder(status, payment_method, btn) {
      if (!cart.length) return null;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Sending\u2026';
      
      try {
        const headers = await authHeader();
        headers['Content-Type'] = 'application/json';
        const res = await fetch(API_BASE + '/api/orders', {
          method: 'POST',
          headers,
          body: JSON.stringify({
            table_name: $('table-input').value.trim() || null,
            items: cart.map((l) => ({ id: l.id, qty: l.qty })),
            notes: $('notes-input').value.trim() || null,
            status,
            payment_method
          }),
        });
        if (res.status === 401) { showGate(); return null; }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          alert((data && data.detail) || 'Could not save the order.');
          return null;
        }
        return data; // Return full order data
      } catch (e) {
        alert('Could not reach the server. Check your connection.');
        return null;
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    }

    // ---- Event Listeners for Cash & Hold ----
    $('btn-hold').addEventListener('click', async () => {
      const res = await submitOrder('held', 'unpaid', $('btn-hold'));
      if (res) { showToast('Ticket held securely'); newTicket(); }
    });
    
    $('btn-pay-cash').addEventListener('click', async () => {
      const res = await submitOrder('sent', 'cash', $('btn-pay-cash'));
      if (res) { showToast('Sent to bar (Cash Paid)'); newTicket(); }
    });

    // ---- GCash Upload Flow ----
    $('btn-pay-gcash').addEventListener('click', () => {
      if (!cart.length) return;
      $('gcash-modal').classList.remove('hidden');
    });

    $('btn-close-modal').addEventListener('click', () => {
      $('gcash-modal').classList.add('hidden');
      $('camera-input').value = '';
    });

    $('btn-camera').addEventListener('click', () => {
      $('camera-input').click();
    });

    $('camera-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      $('upload-status').classList.remove('hidden');
      $('btn-camera').classList.add('hidden');
      $('btn-close-modal').classList.add('hidden');
      
      try {
          // 1. Create the order first as GCash
          const orderData = await submitOrder('sent', 'gcash', { textContent: '' }); 
          if (!orderData) throw new Error("Failed to create order");
          
          const orderId = orderData.id;
          
          // 2. Upload the receipt file
          const formData = new FormData();
          formData.append('receipt', file);
          
          const headers = await authHeader(); 
          // Do not set Content-Type; let the browser handle FormData boundary
          delete headers['Content-Type']; 

          const uploadRes = await fetch(API_BASE + `/api/orders/${orderId}/receipt`, {
              method: 'POST',
              headers,
              body: formData
          });

          if (!uploadRes.ok) {
              const errData = await uploadRes.json().catch(() => ({}));
              throw new Error(errData.detail || 'Failed to upload receipt');
          }

          showToast('Sent to bar & receipt saved!');
          newTicket();
          $('gcash-modal').classList.add('hidden');
          
      } catch (err) {
          alert("Error: " + err.message);
      } finally {
          $('upload-status').classList.add('hidden');
          $('btn-camera').classList.remove('hidden');
          $('btn-close-modal').classList.remove('hidden');
          $('camera-input').value = '';
      }
    });

    renderCategories();
    renderItems();
    renderCart();
  })();
  </script>
</body>
</html>
